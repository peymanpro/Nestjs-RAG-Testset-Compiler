name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.package_manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        package_manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install latest npm
        if: matrix.package_manager == 'npm'
        run: npm install --global npm@12.2.1
      - name: Set up pnpm
        if: matrix.package_manager == 'pnpm'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - name: Install dependencies with npm
        if: matrix.package_manager == 'npm'
        run: npm install --no-audit --no-fund
      - name: Install dependencies with pnpm
        if: matrix.package_manager == 'pnpm'
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: ${{ matrix.package_manager }} run typecheck
      - name: Unit tests
        run: ${{ matrix.package_manager }} test
      - name: Build package
        run: ${{ matrix.package_manager }} run build
      - name: Verify package contents
        run: ${{ matrix.package_manager }} run check:package
      - name: Smoke-test CLI
        run: |
          ${{ matrix.package_manager }} run demo
          ${{ matrix.package_manager }} run validate
          ${{ matrix.package_manager }} run diff
          ${{ matrix.package_manager }} run impact
